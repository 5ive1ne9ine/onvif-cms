services:
  onvif-cms:
    build: .
    container_name: onvif-cms
    restart: unless-stopped
    network_mode: host
    environment:
      DB_URL: jdbc:mysql://192.168.100.101:23306/onvif_cms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: admin123
      APP_SECURITY_KEY: ${APP_SECURITY_KEY:-please-change-this-key}
      MAGE_BASE_URL: ${MAGE_BASE_URL:-http://127.0.0.1:30000/v1}
      MAGE_MODEL: ${MAGE_MODEL:-microsoft/Mage-VL}
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

