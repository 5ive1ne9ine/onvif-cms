# ZLMediaKit 配置 - 聚合部署 (docker-compose.app.yml 专用)
# 所有对外端口落在 20000-29999, 避开 80/554/22000/29999 等。
# WebRTC 走 TCP-ICE (浏览器强制 TCP, 见 WebRtcPlayer.vue), 故 tcpPort/iceTcpPort
# 必须与宿主端口 1:1 映射, 否则 ICE 候选里通告的端口浏览器连不上。
#
# externIP 用占位符 __HOST_LAN_IP__, 由 compose 启动命令用环境变量 ZLM_EXTERN_IP
# 替换为宿主 LAN IP (浏览器必须可达)。未设 ZLM_EXTERN_IP 时保持占位符, WebRTC 会黑屏。
# ZLM 合并加载: 此文件只覆盖关键段, 其余用镜像内置默认值。

[api]
secret=onvifCms2024SecretKey4ZlmApi
apiDebug=1
downloadRoot=./www
snapRoot=./www/snap/

[hook]
enable=1
admin_params=secret=onvifCms2024SecretKey4ZlmApi
# ZLM 与 CMS 同在 bridge 网络, 直接用服务名 cms:18080 回调
on_server_keepalive=http://cms:18080/zlm/hook/on_server_keepalive
on_publish=http://cms:18080/zlm/hook/on_publish
on_stream_changed=http://cms:18080/zlm/hook/on_stream_changed
on_stream_none_reader=http://cms:18080/zlm/hook/on_stream_none_reader
on_stream_not_found=http://cms:18080/zlm/hook/on_stream_not_found
on_play=http://cms:18080/zlm/hook/on_play
on_record_mp4=http://cms:18080/zlm/hook/on_record_mp4
on_record_ts=http://cms:18080/zlm/hook/on_record_ts
on_rtsp_realm=http://cms:18080/zlm/hook/on_rtsp_realm
on_rtsp_auth=http://cms:18080/zlm/hook/on_rtsp_auth
on_shell_login=http://cms:18080/zlm/hook/on_shell_login
on_flow_report=http://cms:18080/zlm/hook/on_flow_report
on_http_access=http://cms:18080/zlm/hook/on_http_access
on_send_rtp_stopped=http://cms:18080/zlm/hook/on_send_rtp_stopped
timeoutSec=10

[http]
port=80
allow_cross_domains=1
dirMenu=1
rootPath=./www
charSet=utf-8

[rtsp]
port=554
directProxy=1
handshakeSecond=15
keepAliveSecond=15

[rtmp]
port=1935

[rtc]
externIP=__HOST_LAN_IP__
port=28000
tcpPort=28000
icePort=23478
iceTcpPort=23478
enableTurn=1
icePwd=ZLMediaKit
iceUfrag=ZLMediaKit
preferredCodecA=PCMA,PCMU,opus,mpeg4-generic
preferredCodecV=H264,H265,AV1,VP9,VP8
datachannel_echo=1

[record]
appName=record
filePath=/opt/media/bin/www/record/
fileSecond=10
sampleMS=500
fastStart=0

[ffmpeg]
bin=/usr/bin/ffmpeg
snap=%s -i %s -y -f mjpeg -frames:v 1 -an %s
log=./ffmpeg/ffmpeg.log

[protocol]
enable_audio=1
enable_rtsp=1
enable_rtmp=1
enable_hls=1
enable_ts=1
enable_fmp4=1
add_mute_audio=1

[general]
mediaServerId=onvif_cms_zlm
enableVhost=0
streamNoneReaderDelayMS=20000

[rtp_proxy]
port=10000
port_range=30000-35000
