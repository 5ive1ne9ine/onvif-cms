# ZLMediaKit 配置 - 覆盖默认值, 与 Spring Boot 后端协同
# 详细文档: https://github.com/ZLMediaKit/ZLMediaKit/wiki/%E9%85%8D%E7%BD%AE%E6%96%87%E4%BB%B6

[api]
secret=onvifCms2024SecretKey4ZlmApi
defaultSnap=

[hook]
enable=1
admin_params=secret=onvifCms2024SecretKey4ZlmApi
on_server_keepalive=http://host.docker.internal:18080/zlm/hook/on_server_keepalive
on_publish=http://host.docker.internal:18080/zlm/hook/on_publish
on_stream_changed=http://host.docker.internal:18080/zlm/hook/on_stream_changed
on_stream_none_reader=http://host.docker.internal:18080/zlm/hook/on_stream_none_reader
on_stream_not_found=http://host.docker.internal:18080/zlm/hook/on_stream_not_found
on_play=http://host.docker.internal:18080/zlm/hook/on_play
on_record_mp4=http://host.docker.internal:18080/zlm/hook/on_record_mp4
on_record_ts=http://host.docker.internal:18080/zlm/hook/on_record_ts
on_rtsp_realm=http://host.docker.internal:18080/zlm/hook/on_rtsp_realm
on_rtsp_auth=http://host.docker.internal:18080/zlm/hook/on_rtsp_auth
on_shell_login=http://host.docker.internal:18080/zlm/hook/on_shell_login
on_flow_report=http://host.docker.internal:18080/zlm/hook/on_flow_report
on_http_access=http://host.docker.internal:18080/zlm/hook/on_http_access
on_send_rtp_stopped=http://host.docker.internal:18080/zlm/hook/on_send_rtp_stopped
timeoutSec=10

[http]
port=80
sslport=443

[rtsp]
port=554

[rtmp]
port=1935

[rtc]
externIP=127.0.0.1
port=8000
tcpPort=8000

[record]
appName=record
sampleMS=500
fileSecond=10
filePath=/opt/media/bin/www/record/

[general]
enableVhost=0
mediaServerId=onvif_cms_zlm
# ZLMediaKit 配置 - 覆盖默认值, 与 Spring Boot 后端协同
# 详细文档: https://github.com/ZLMediaKit/ZLMediaKit/wiki/%E9%85%8D%E7%BD%AE%E6%96%87%E4%BB%B6

[api]
apiDebug=1
downloadRoot=./www
snapRoot=./www/snap/

[cluster]
origin_url=
retry_count=3
timeout_sec=15

[ffmpeg]
bin=/usr/bin/ffmpeg
cmd=%s -re -i %s -c:a aac -strict -2 -ar 44100 -ab 48k -c:v libx264 -f flv %s
log=./ffmpeg/ffmpeg.log
restart_sec=0
snap=%s -i %s -y -f mjpeg -frames:v 1 -an %s

[general]
broadcast_player_count_changed=0
check_nvidia_dev=1
enable_ffmpeg_log=0
flowThreshold=1024
listen_ip=::
maxStreamWaitMS=15000
mergeWriteMS=0
resetWhenRePlay=1
streamNoneReaderDelayMS=20000
unready_frame_cache=100
wait_add_track_ms=3000
wait_audio_track_data_ms=1000
wait_track_ready_ms=10000

[hls]
broadcastRecordTs=0
deleteDelaySec=10
fastRegister=0
fileBufSize=65536
fmp4SegExt=.mp4
segDelay=0
segDur=2
segKeep=0
segNum=3
segRetain=5

[hook]
alive_interval=30.000000
on_rtp_server_timeout=
on_server_exited=
on_server_started=
retry=1
retry_delay=3.000000
stream_changed_schemas=rtsp/rtmp/fmp4/ts/hls/hls.fmp4

[http]
allow_cross_domains=1
allow_ip_range=::1,127.0.0.1,172.16.0.0-172.31.255.255,192.168.0.0-192.168.255.255,10.0.0.0-10.255.255.255
charSet=utf-8
dirMenu=1
forbidCacheSuffix=
forwarded_ip_header=
keepAliveSecond=15
maxReqSize=40960
notFound=<html><head><title>404 Not Found</title></head><body bgcolor="white"><center><h1>您访问的资源不存在！</h1></center><hr><center>ZLMediaKit(git hash:5f11d3b/2026-06-13T21:01:47-07:00,branch:master,build time:2026-06-14T04:02:54)</center></body></html>
rootPath=./www
sendBufSize=65536
virtualPath=

[multicast]
addrMax=239.255.255.255
addrMin=239.0.0.0
udpTTL=64

[onvif]
port=3702

[protocol]
add_mute_audio=1
auto_close=0
continue_push_ms=15000
enable_audio=1
enable_fmp4=1
enable_hls=1
enable_hls_fmp4=0
enable_mp4=0
enable_rtmp=1
enable_rtsp=1
enable_ts=1
fmp4_demand=0
hls_demand=0
hls_save_path=./www
modify_stamp=2
mp4_as_player=0
mp4_max_second=3600
mp4_save_path=./www
paced_sender_ms=0
rtmp_demand=0
rtsp_demand=0
ts_demand=0

[python]
plugin=

[record]
enableFmp4=0
fastStart=0
fileBufSize=65536
fileRepeat=0

[rtc]
bfilter=0
datachannel_echo=1
enableTurn=1
icePort=3478
icePwd=ZLMediaKit
iceTcpPort=3478
iceTransportPolicy=0
iceUfrag=ZLMediaKit
interfaces=
maxRtpCacheMS=5000
maxRtpCacheSize=2048
max_bitrate=0
max_stun_retry=7
min_bitrate=0
nackAudioRtpSize=4
nackIntervalRatio=1.000000
nackMaxCount=15
nackMaxMS=3000
nackMaxSize=2048
nackRtpSize=8
port_range=49152-65535
preferredCodecA=PCMA,PCMU,opus,mpeg4-generic
preferredCodecV=H264,H265,AV1,VP9,VP8
preferred_tcp=0
rembBitRate=0
signalingPort=3000
signalingSslPort=3001
start_bitrate=0
timeoutSec=15

[rtmp]
directProxy=1
enhanced=1
handshakeSecond=15
keepAliveSecond=15
sslport=19350

[rtp]
audioMtuSize=600
h264_stap_a=1
lowLatency=0
rtpMaxSize=10
videoMtuSize=1400

[rtp_proxy]
dumpDir=
gop_cache=1
h264_pt=98
h265_pt=99
merge_frame=1
opus_pt=100
port=10000
port_range=30000-35000
ps_pt=96
rtp_g711_dur_ms=100
timeoutSec=15
udp_recv_socket_buffer=4194304

[rtsp]
authBasic=0
directProxy=1
handshakeSecond=15
keepAliveSecond=15
lowLatency=0
rtpTransportType=-1
sslport=332

[shell]
maxReqSize=1024
port=9000

[srt]
latencyMul=4
passPhrase=
pktBufSize=8192
port=9000
timeoutSec=5

