# 聚合部署: ZLMediaKit + onvif-cms 后端 (不含数据库)
# 数据库为外部 MySQL, 由 DB_HOST/DB_PORT/... 指向 (默认 192.168.100.101:23306)。
# 所有对外端口落在 20000-29999, 避开 80/5050/5056/8050/22000/29999/9001/51413/554。
#
# 启动:
#   1) 复制 .env.app.example -> .env.app, 填 ZLM_EXTERN_IP (宿主 LAN IP, 浏览器需可达)
#   2) docker compose -f docker/docker-compose.app.yml --env-file docker/.env.app up -d --build
#
# WebRTC 说明: 浏览器强制 TCP-ICE (Docker Desktop vpnkit 丢 UDP), 故 ZLM 的
# tcpPort(28000)/iceTcpPort(23478) 与宿主 1:1 映射; externIP 由启动命令用
# ZLM_EXTERN_IP 替换进 config.ini。

services:
  zlm:
    image: zlmediakit/zlmediakit:master
    container_name: onvif-cms-zlm          # 固定名: CMS 转码通过 docker exec 进入此容器
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      ZLM_EXTERN_IP: ${ZLM_EXTERN_IP:-127.0.0.1}
    # 镜像无 entrypoint, CMD=[./MediaServer -s default.pem -c ../conf/config.ini -l 0]
    # 在启动前把 config.ini 的 __HOST_LAN_IP__ 替换为 ZLM_EXTERN_IP
    command:
      - sh
      - -c
      - |
        sed -i "s|__HOST_LAN_IP__|$$ZLM_EXTERN_IP|g" /opt/media/conf/config.ini
        exec ./MediaServer -s default.pem -c ../conf/config.ini -l 0
    ports:
      - "20080:80"          # ZLM HTTP API / 调试 (getServerConfig 等)
      - "20554:554"         # RTSP (VLC 手动播放, 后端返回的 rtsp 字段仍写 :554, 仅作参考)
      - "28000:28000/tcp"   # WebRTC 媒体 (TCP-ICE, 1:1)
      - "28000:28000/udp"   # WebRTC 媒体 (UDP, 备用)
      - "23478:23478/tcp"   # TURN/ICE (TCP, 1:1)
      - "23478:23478/udp"   # TURN/ICE (UDP)
    volumes:
      - ./zlm-config.app.ini:/opt/media/conf/config.ini
      - ./zlm-record:/opt/media/bin/www/record
    networks:
      - cms-net

  cms:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: onvif-cms:latest
    container_name: onvif-cms-app
    restart: unless-stopped
    depends_on:
      - zlm
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      # 外部数据库
      DB_HOST: ${DB_HOST:-192.168.100.101}
      DB_PORT: ${DB_PORT:-23306}
      DB_NAME: ${DB_NAME:-onvif_cms}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      # ZLM (同网络服务名 zlm)
      ZLM_BASE_URL: http://zlm:80
      ZLM_SECRET: ${ZLM_SECRET:-onvifCms2024SecretKey4ZlmApi}
      ZLM_EXTERN_IP: ${ZLM_EXTERN_IP:-127.0.0.1}
      ZLM_CONTAINER: onvif-cms-zlm          # 转码 docker exec 目标容器
      # 业务密钥
      JWT_SECRET: ${JWT_SECRET:-please-change-me-to-a-very-long-random-string-at-least-32-bytes}
      ONVIF_AES_KEY: ${ONVIF_AES_KEY:-0123456789ABCDEF}
      RECORD_DIR: /data/recordings
      SNAPSHOT_DIR: /data/snapshots
    ports:
      - "28080:18080"        # 前端 UI + REST API (主入口)
    volumes:
      - ./recordings:/data/recordings
      - ./snapshots:/data/snapshots
      # 转码需要: CMS 容器内执行 docker exec onvif-cms-zlm ffmpeg ...
      # 挂载宿主 docker.sock 等价于宿主 root 权限, 仅在需要主码流转码时开启。
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cms-net

networks:
  cms-net:
    driver: bridge
