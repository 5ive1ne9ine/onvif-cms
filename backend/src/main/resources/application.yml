server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: onvif-cms
  datasource:
    url: jdbc:mysql://localhost:3306/onvif_cms?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: AUTO

cms:
  jwt:
    secret: please-change-me-to-a-very-long-random-string-at-least-32-bytes
    expire-minutes: 720
    header: Authorization
    prefix: "Bearer "
  storage:
    record-dir: D:/onvif-cms/recordings
    snapshot-dir: D:/onvif-cms/snapshots
    segment-cache-seconds: 60
  onvif:
    discovery-timeout-ms: 4000
    pull-interval-seconds: 5
    subscription-ttl-seconds: 60
    aes-key: 0123456789ABCDEF
  ffmpeg:
    bin: ffmpeg

zlm:
  base-url: http://localhost:80
  secret: 035c73f7-bb6b-4889-a715-d9eb2d1925cc
  default-app: live
  rtp-type: 0
  hook-token: internal
  webrtc:
    extern-ip: 127.0.0.1
    play-type: play

logging:
  level:
    com.acme.cms: DEBUG
    org.springframework.web: INFO
