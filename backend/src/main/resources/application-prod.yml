spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:onvif_cms}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}

cms:
  jwt:
    secret: ${JWT_SECRET:please-change-me-to-a-very-long-random-string-at-least-32-bytes}
  storage:
    record-dir: ${RECORD_DIR:/data/recordings}
    snapshot-dir: ${SNAPSHOT_DIR:/data/snapshots}
  onvif:
    aes-key: ${ONVIF_AES_KEY:0123456789ABCDEF}

zlm:
  base-url: ${ZLM_BASE_URL:http://zlm:80}
  secret: ${ZLM_SECRET:onvifCms2024SecretKey4ZlmApi}
  webrtc:
    extern-ip: ${ZLM_EXTERN_IP:}

logging:
  level:
    com.acme.cms: INFO
